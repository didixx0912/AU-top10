name: Update AU Top 10 Clash Subscriptionon:  schedule:    - cron: "0 */6 * * *"  workflow_dispatch:permissions:  contents: writejobs:  update-proxies:    runs-on: ubuntu-latest    steps:      - name: Checkout repository        uses: actions/checkout@v4      - name: Set up Python        uses: actions/setup-python@v5        with:          python-version: "3.11"      - name: Install dependencies        run: pip install requests[socks] beautifulsoup4 pyyaml      - name: Fetch, test, and generate AU Top 10 Clash YAML        run: python update_au_proxies.py      - name: Commit and push updated subscription        run: |          git config user.name "github-actions[bot]"          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"          git add au_top10_clash.yaml          if git diff --staged --quiet; then            echo "No changes to au_top10_clash.yaml"          else            git commit -m "chore: update AU Top 10 Clash proxies [skip ci]"            git push          fi
